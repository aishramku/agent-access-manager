# One-click deploy of the backend on Render (free plan).
# Render: New + > Blueprint > pick this repo. It reads this file.
services:
  - type: web
    name: agent-access-manager-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AAM_JWT_SECRET          # signing key for agent tokens; Render generates a random one
        generateValue: true
      - key: AAM_ALLOWED_ORIGINS     # only your GitHub Pages site may call the API from a browser
        value: https://aishramku.github.io
